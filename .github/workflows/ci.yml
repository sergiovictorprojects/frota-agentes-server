name: CI

on:
  pull_request:
  push:
    branches: [master]

# Só leitura: o CI não publica nada, não usa segredos e não acessa o banco de produção.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Testes com cobertura: falha se statements, branches, functions ou lines caírem abaixo dos limites
      # de vitest.config.ts (coverage.thresholds). Os testes sobem um Postgres embutido sozinhos
      # (test/helpers/global-setup.ts): nenhum banco externo, segredo ou artefato publicado.
      - name: Executar testes com cobertura
        run: npm run test:coverage -- --reporter=default --reporter=json --outputFile.json=.vitest-results.json

      # Defesa contra falso verde: o Vitest 5 pode terminar com código zero quando falhas de migration
      # acontecem em hooks e deixam as demais suítes puladas. O relatório estruturado continua marcando
      # `success: false`; esta etapa transforma esse estado em falha real do workflow.
      - name: Conferir resultado estruturado dos testes
        if: always()
        run: node scripts/verificar-resultados-vitest.ts .vitest-results.json
